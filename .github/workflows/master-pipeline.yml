name: Master Branch Pipeline

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: "3.12"
      run_tests: true

  docker-build-push:
    name: Docker Build and Push
    needs: build-test
    uses: ./.github/workflows/reusable-docker.yml
    with:
      image_name: github-actions-capstone
      tag: latest
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_token: ${{ secrets.DOCKER_TOKEN }}

  scan-image:
    name: Scan Docker Image for Vulnerabilities
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  deploy:
    name: Deploy to Production
    needs: scan-image
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy image
        run: |
          echo "Deploying image: ${{ needs.docker-build-push.outputs.image_url }} to production"

