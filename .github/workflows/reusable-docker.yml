name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker Hub image name"
        required: true
        type: string

      tag:
        description: "Docker image tag"
        required: true
        type: string

    secrets:
      docker_username:
        description: "Docker Hub username"
        required: true

      docker_token:
        description: "Docker Hub access token"
        required: true

    outputs:
      image_url:
        description: "Full Docker image path"
        value: ${{ jobs.docker-build-push.outputs.image_url }}

jobs:
  docker-build-push:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      # 3. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./2026/day-48/github-actions-capstone
          file: ./2026/day-48/github-actions-capstone/Dockerfile
          push: true
          tags: |
            ${{ secrets.docker_username }}/${{ inputs.image_name }}:latest
            ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}

      # 4. Trivy security scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # 5. Upload Trivy report
      - name: Upload Trivy Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.txt

      # 6. Set image URL output
      - name: Set Image URL
        id: image
        run: |
          IMAGE_URL="${{ secrets.docker_username }}/${{ inputs.image_name }}:${{ inputs.tag }}"
          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "Docker image: $IMAGE_URL"
