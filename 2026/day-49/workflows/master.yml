name: Master Pipeline

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:

  # 1. Build and Test
  build-test:
    name: Python Build & Test
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      python_version: '3.12'
      run_tests: true

  # 2. Build Docker Image
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./2026/day-48/github-actions-capstone
          file: ./2026/day-48/github-actions-capstone/Dockerfile
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest

  # 3. Trivy Security Scan
  security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker Image for Scan
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest \
            ./2026/day-48/github-actions-capstone

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # 4. Push Docker Image
  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./2026/day-48/github-actions-capstone
          file: ./2026/day-48/github-actions-capstone/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/github-actions-capstone:latest
