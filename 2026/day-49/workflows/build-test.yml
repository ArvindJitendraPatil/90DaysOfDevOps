name: Reusable — Python Build & Test

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version'
        type: string
        required: true

      run_tests:
        description: 'Run tests'
        type: boolean
        required: true

    outputs:
      test_result:
        description: 'Python test result'
        value: ${{ jobs.build-test.outputs.test_result }}

permissions:
  contents: read

jobs:

  build-test:
    name: Python Build & Test
    runs-on: ubuntu-latest

    outputs:
      test_result: ${{ steps.test-result.outputs.result }}

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f 2026/day-48/github-actions-capstone/requirements.txt ]; then
            pip install -r 2026/day-48/github-actions-capstone/requirements.txt
          fi

      # 4. Python syntax check
      - name: Python syntax check
        run: |
          python -m compileall 2026/day-48/github-actions-capstone

      # 5. Run tests
      - name: Run tests
        id: run-tests
        if: ${{ inputs.run_tests }}
        working-directory: ./2026/day-48/github-actions-capstone
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          else
            echo "No tests directory found"
          fi

      # 6. Set result
      - name: Set test result
        id: test-result
        if: always()
        run: |
          if [ "${{ steps.run-tests.outcome }}" = "failure" ]; then
            echo "result=failed" >> "$GITHUB_OUTPUT"
          else
            echo "result=passed" >> "$GITHUB_OUTPUT"
          fi
