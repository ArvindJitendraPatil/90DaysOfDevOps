name: Secure Docker Hub Authentication

on:
  workflow_dispatch: 
  
jobs:
  secrets-env:
    runs-on: ubuntu-latest

    steps:
      - name: Use secrets as environment variables
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: |
          echo "Docker Username is set: ${DOCKER_USERNAME:+true}"
          echo "Docker Token is set: ${DOCKER_TOKEN:+true}"
